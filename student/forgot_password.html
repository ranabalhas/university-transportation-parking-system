<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<link rel="stylesheet"href="/university_system/css/style.css">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

</head>

<body class="auth-body">

<div class="auth-container">

<div class="auth-box">

<h2>Reset Password</h2>

<form action="/university_system/php/send_reset.php" method="POST"onsubmit="showLoading(document.getElementById('resetBtn'),'Sending...')">

<input type="email"
name="email"
placeholder="Enter your email"
required>

<button type="submit"class="auth-btn"id="resetBtn">Send Reset Link</button>

</form>

<br>

<a href="student_auth.php"> Back To Login</a>
</div>

</div>

<div id="loadingSpinner" class="loading-overlay hidden">

    <div class="spinner-box">

        <div class="spinner"></div>

        <p>Please wait...</p>

    </div>

</div>
<div id="toast" class="toast"></div>
<script>

function showLoading(button = null, text = "Please wait...") {

    document.getElementById("loadingSpinner").classList.remove("hidden");

    if (button) {

        button.disabled = true;

        button.innerText = text;
    }
}

window.onpageshow = function(event){

    if(event.persisted){

        window.location.reload();
    }
};

window.addEventListener("pageshow", function(){

    document.getElementById("loadingSpinner")
        .classList.add("hidden");

    document.querySelector("form").reset();
});

function showToast(message){

    let toast = document.getElementById("toast");

    toast.innerText = message;

    toast.className = "toast show";

    setTimeout(() => {

        toast.className = "toast";

    }, 3000);
}

window.onload = function(){

    const params = new URLSearchParams(window.location.search);

    const error = params.get("error");

    if(error === "email_not_found"){

        showToast("Email not found");
    }

    if(error === "expired_token"){

        showToast("Reset link expired. Please request a new one.");
    }

    if(window.history.replaceState){

        window.history.replaceState(
            null,
            null,
            window.location.pathname
        );
    }
};

</script>
</body>
</html>
